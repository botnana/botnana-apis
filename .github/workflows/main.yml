name: CI
run-name: ${{ github.actor }} is building branch ${{ github.ref }}
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Triggered by a ${{ github.event_name }} event."
      - run: echo "Running on a GitHub-hosted ${{ runner.os }} server!"
      - run: echo "Branch is ${{ github.ref }}, repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to build code on the runner."
      - run: echo "workspace is $USER@$HOSTNAME:$PWD" 
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - name: Install ARM64 build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
      - name: Make arm64
        working-directory: botnanac
        run: |
          make ./lib/libbotnana_arm64.a
      - name: Make x86_64
        working-directory: botnanac
        run: |
          make ./lib/libbotnana_x86_64.a
      - name: Make words
        working-directory: botnanac
        run: |
          make words
      - run: echo "✅ This job's status is ${{ job.status }}."
